# Question contract - machine-readable source of truth.
#
# The CI consistency checks (07-TEST-PLAN.md C1-C4) are GENERATED from this file rather than
# grepped from prose. Revision 3 tried to enforce "no question references another's outcome"
# by pattern-matching natural-language instructions, which cannot be reliable.
#
# Rules enforced from this metadata:
#   C1  every question has >=1 policy_consumer, and every consumer exists in the dispatcher
#   C2  every emitted command exists in the protocol vocabulary
#   C3  required_capabilities subset of the target phase's capability manifest
#   C4  references_answers MUST be empty for every question
#
# `enabled_when` is evaluated at request-build time. A question whose condition is false is
# OMITTED from the request entirely - never sent with a null (02-ARCHITECTURE.md field contract).

schema_version: 1
model: jev-1.13.0

# How Risk of Rain 2 is played, sent in every request as `state.game` (jev-02: asked to judge
# options with no idea what they are for, JEV walked to the teleporter 84 times in 91 while
# the character fought its way back and forth). Short, literal, positive facts -- JEV reads
# literally and large irrelevant state degrades it (01-RESEARCH.md section 2). Review it.
game_primer:
  - "Killing enemies is the only way to earn gold and experience."
  - "Gold opens chests. Chests give items. Items and experience levels make the character stronger."
  - "Enemies grow stronger as run time passes, so time on a stage is well spent only if it makes the character stronger: kills, chests, items."
  - "Starting the teleporter summons a boss and many extra enemies, and it cannot be undone. The character must then stay inside the teleporter zone until it is fully charged."
  - "A strong stage: fight the enemies nearby, open the chests the character can afford, then start the teleporter once the character is strong enough to beat a boss."
  - "A fight that is going well is worth finishing. Walking away from damaged enemies throws away the damage already dealt."
  - "When health is full and few enemies are near, opening an affordable chest is usually the best use of time: items are the main way to get stronger besides levelling up."
  - "Difficulty rises with run time, from Easy through Medium, Hard and worse: the same enemies hit harder and take more killing later. `run.difficulty_band` is how far that has gone."
  - "A stage ends only by starting the teleporter, surviving the boss, and leaving through it. Staying on one stage forever makes every later fight harder and finishes nothing."
  - "Once `objective.unopened_left_here` is nothing -- the stage is picked clean -- and health is good, starting the teleporter is usually the right move. `run.stage_time_band` says how long this stage has taken: fresh, settled, or overdue."
  - "`objective.unopened_left_here` counts what is still unopened here; `objective.affordable_left_here` counts what the character can pay for right now. Chests it cannot afford yet are a reason to fight for gold, not a reason to leave."

questions:

  next_action:
    type: choice
    dynamic: true                      # options generated from the action registry
    enabled_when: always               # registry is never empty (06 invariant 1)
    # Narrowed from the whole `threat` block (F4, F30): these are the parts task choice uses, and
    # stock already measures all three. Unknown sub-fields are stripped from the wire state, so
    # the `threat` the instructions name is only ever the measured part.
    required_state_fields:
      - threat.enemies_near
      - threat.nearest_enemy_band
      - threat.boss_active
      - hazards
      - economy.gold_band
      - run.time_band
      - objective.phase
    required_capabilities: []          # individual options are capability-gated in the registry
    policy_consumers:
      - dispatch.task_channel
    references_answers: []
    notes: >
      The ONLY question that selects an executable task. Revision 2's primary_objective could
      contradict it inside the same parallel request; revision 3 removed it.

  engagement_response:
    type: choice
    options: [hold_and_fight, reposition, full_disengage]
    enabled_when: capability(disengage)
    required_state_fields:
      - threat.reposition_feasible
      - threat.full_withdrawal_feasible
      - hazards
    required_capabilities: [disengage]
    policy_consumers:
      - dispatch.disengage_channel
    references_answers: []

  strategy:
    type: choice
    options: [aggressive, defensive, balanced]
    enabled_when: capability(set_posture)
    required_state_fields: [threat, self.hp_band, build.identity]
    required_capabilities: [set_posture]
    policy_consumers:
      - dispatch.posture_channel
    references_answers: []
    hysteresis: { entry: 0.55, exit: 0.35, dwell_ms: 800 }

  engage_range:
    type: choice
    options: [melee, close, mid, far]
    enabled_when: capability(set_posture)
    required_state_fields: [run.survivor, build.identity, threat.enemy_classes]
    required_capabilities: [set_posture]
    policy_consumers:
      - dispatch.posture_channel
    references_answers: []
    hysteresis: { entry: 0.50, exit: 0.30, dwell_ms: 600 }

  target_priority:
    type: choice
    options: [focus_boss, clear_adds, nearest]
    enabled_when: capability(set_posture)
    # F34: who to shoot was the mod's fixed scoring (boss +50), so a character holding
    # kill-healing items burned the boss while small enemies wore it down (jev-03).
    required_state_fields:
      - threat.enemies_near
      - threat.boss_active
      - threat.enemy_classes
      - self.hp_band
      - build.effects
    required_capabilities: [set_posture]
    policy_consumers:
      - dispatch.posture_channel
    references_answers: []

  continue_is_worthwhile:
    type: noul
    enabled_when: active_task_exists
    required_state_fields:
      - control.active_action
      - control.progress_band          # MEASURED by the mod, never inferred by JEV
      - control.consecutive_failures
    required_capabilities: []
    policy_consumers:
      - dispatch.task_channel.cancel
    references_answers: []
    threshold: { abandon_below: 0.35 }

  use_equipment_now:
    type: noul
    # All four equipment contract fields must hold (03-QUESTION-SET.md section 3).
    enabled_when: >
      capability(equipment)
      and self.equipment.supported_activation
      and self.equipment.ready
      and self.equipment.valid_target_available
      and self.equipment.activation_compatible
    required_state_fields: [self.equipment]
    required_capabilities: [equipment]
    policy_consumers:
      - dispatch.equipment_channel
    references_answers: []
    threshold: { fire_above: 0.65 }

  situation_is_novel:
    type: noul
    # Its ONLY consumer is L2 escalation, and L2 is disabled by default (--jev-only).
    # Revision 3 sent it unconditionally, which violated C1 in the default configuration.
    enabled_when: counsel_enabled
    required_state_fields: [threat, objective.phase, control]
    required_capabilities: []
    policy_consumers:
      - counsel.escalation_trigger
    references_answers: []
    threshold: { escalate_above: 0.70 }

# Generated per-tick, one per registry record with requires_worth_gate: true.
# Name: worth_<action_id>. Independently answerable - names its own entity, references no
# other answer. This is the fix for the revision-1 answer-chaining defect.
dynamic_question_templates:
  worth_gate:
    type: noul
    name_pattern: "worth_{action_id}"
    generated_from: registry.records[requires_worth_gate == true]
    required_state_fields: [economy.gold_band, self.hp_band, build.identity,
                            run.stage_time_band, objective.unopened_left_here,
                            objective.affordable_left_here]
    policy_consumers:
      - dispatch.task_channel.gates_satisfied
    references_answers: []
    threshold: { authorize_above: 0.75 }

# Probability gates on next_action, keyed by the selected record's commitment class.
# Worth gates apply to `irreversible` ONLY - see 06-ACTION-REGISTRY.md section 3.
commitment_gates:
  reversible:   { entry: 0.40, worth_gate_required: false }
  costly:       { entry: 0.50, worth_gate_required: false }
  irreversible: { entry: 0.55, worth_gate_required: true }

# Questions deliberately held out of the MVP. Each names what it needs before returning.
deferred:
  threat_level:
    reason: >
      No policy consumer, and a legend maps integer indices to descriptions so it cannot resolve
      a fractional score. Needs short stable level labels plus an explicit interpretation rule
      consuming `probabilities` by name - never the scalar.
  time_pressure:
    reason: Same as threat_level.
  primary_objective:
    reason: >
      Could contradict next_action within the same parallel request. If reinstated, it must be a
      persistent recommendation adopted for SUBSEQUENT observations, never read in the tick that
      produced it.
  build_identity: { reason: No executable consumer until Group E commands exist. }
  printer_worth_using: { reason: Requires use_printer capability. }
  shop_item_pick: { reason: Requires multishop telemetry. }
  pillar_target: { reason: Commencement only; out of MVP scope. }
  hold_the_zone: { reason: Requires defend_zone beyond the minimal Phase 2 version. }

# ---------------------------------------------------------------------------------------
# WIRE PAYLOAD  (added in Phase 0 for roadmap step 6 / check C8)
#
# The token-bearing text -- `instructions` and `criteria` -- previously existed only as
# prose in docs/03-QUESTION-SET.md, so the serialized catalog could not be built and its
# size could not be measured. It is transcribed here verbatim from 03 section 1.
#
# Entries marked AUTHORED-IN-PHASE-0 had no option prose in 03: their verbs are listed in
# the registry taxonomy but were never given text. They follow the same what/not_for
# rubric and are flagged for review before the catalog is treated as settled.
#
# Rule 6 of section 0 applies to every string here: state fields are referenced by name in
# backticks, and every question is phrased positively.
# ---------------------------------------------------------------------------------------

payload:

  next_action:
    instructions: >-
      Choose what the character should do next. Each option is a complete committed action
      including what it costs. `game` explains how the game is played. Judge each option
      against `threat`, `hazards`, `economy.gold_band`, `run.time_band` and `objective.phase`.
    # Per-verb option text. The rendered option key is `<verb>:<entity_id>` for entity
    # verbs and the bare verb for non-entity verbs.
    option_templates:
      open_chest:
        what: "Open the {cost_band} chest you are standing at. Spends gold, guaranteed item."
        not_for: "When gold is better saved or the route is unsafe."
      use_shrine_chance:
        what: "Gamble at the Shrine of Chance you are standing at. Spends gold, may give nothing."
        not_for: "Runs that cannot afford to lose the gold."
      start_teleporter:
        what: "Begin the boss event at the teleporter you are standing at. Irreversible."
        not_for: "A character too weak for the boss, or reachable loot with time to take it."
      search_teleporter:
        what: "Explore the stage to find the teleporter. Costs only time."
        not_for: "Stages where the teleporter is already found."
      explore:
        what: "Move through unexplored parts of the stage looking for anything useful."
      open_barrel:                                 # jev-03
        what: "Open the barrel you are standing at. Free; gives a little gold and experience."
      open_equipment_barrel:                       # jev-03
        what: "Open the equipment barrel you are standing at ({cost_band}). Spends gold; gives a random equipment item, which replaces any equipment carried."
        not_for: "When the gold is needed for a chest."
      buy_from_terminal:                           # jev-03
        what: "Buy {item} from the shop terminal you are standing at ({cost_band}). Spends gold; the item is known before paying."
        not_for: "An item that does not fit `build.identity`, or an unknown item when a chest is affordable."
      repair_drone:                                # jev-03
        what: "Repair the broken drone you are standing at ({cost_band}). Spends gold that a chest could have used; it then fights alongside the character until it is destroyed."
        not_for: "When the gold is needed for a chest."
      fight_nearby:                                # jev-02
        what: "Stay and fight the enemies nearby until they are dead. Kills give gold and experience."
        not_for: "Health too low to keep trading hits, or an enemy group too strong to win against."
      navigate:                                    # AUTHORED-IN-PHASE-0
        # F36: jev-01 chose navigate:teleporter at ~0.9 every tick; every navigate option had
        # this same text, so only the key told a cheap nearby chest from the teleporter.
        what: "Walk to {target}. Only walking: nothing is used or started on arrival. Costs only time."
        not_for: "Targets whose reward does not justify crossing the distance."
      use_shrine_blood:                            # AUTHORED-IN-PHASE-0
        what: "Pay health at the Shrine of Blood you are standing at. Spends health, gives gold."
        not_for: "Low health, or a fight that is about to start."
      advance_stage:                               # AUTHORED-IN-PHASE-0
        what: "Leave the stage through the charged teleporter you are standing at. Irreversible."
        not_for: "Reachable loot the run still needs, with time left to take it."
      defend_zone:                                 # AUTHORED-IN-PHASE-0
        what: "Hold position inside the teleporter radius so it keeps charging."
        not_for: "When the position cannot be survived."
      fight_boss:                                  # AUTHORED-IN-PHASE-0
        what: "Commit to attacking this specific enemy until it dies."
        not_for: "When the fight is being lost, or a lesser threat is the real problem."
    sentinels:
      none:
        what: "Start nothing new right now."
        not_for: "When a clearly worthwhile action is available."
      continue_current_action:                     # AUTHORED-IN-PHASE-0
        what: "Keep working on the action already in progress. Starts nothing new."
        not_for: "When the action in progress no longer serves the run."

  engagement_response:
    instructions: >-
      How should the character respond to the current situation?
      `threat.reposition_feasible` and `threat.full_withdrawal_feasible` state which
      movements are possible; do not choose one that is not feasible. `hazards` describes
      damage sources that are not engaged enemies.
    criteria:
      hold_and_fight:
        what: "Stay and finish the fight, or stay put if nothing is threatening."
        not_for: "When the fight is being lost, or a hazard is doing steady damage."
      reposition:
        what: >-
          Move to better ground while staying engaged - break line of sight, gain height,
          leave a melee cluster or a hazard volume.
        not_for: "When a full withdrawal is needed."
      full_disengage:
        what: >-
          Withdraw from the area entirely and recover. Temporarily abandoning an objective
          is acceptable if staying would be fatal.
        not_for: "When the threat is mild enough to handle by repositioning."

  strategy:
    instructions: >-
      Choose the combat posture that fits `threat`, `self.hp_band` and `build.identity`.
    criteria:
      aggressive:
        what: "Close distance and maximise damage."
        not_for: "Low health or heavy incoming fire."
      defensive:
        what: "Prioritise survival, keep distance, use mobility."
        not_for: "Fights that must end quickly."
      balanced:
        what: "Trade damage and safety evenly."
        not_for: "Clear emergencies in either direction."

  engage_range:
    instructions: >-
      At what distance should the character fight, given `run.survivor`, `build.identity`
      and `threat.enemy_classes`?
    criteria:
      melee:
        what: "Directly adjacent. For melee survivors and short-range builds."
      close:
        what: "Just outside melee reach, staying mobile."
      mid:
        what: "Comfortable weapon range, kiting between shots."
      far:
        what: "Maximum effective range, avoiding melee contact."

  target_priority:
    instructions: >-
      Which enemies should the character shoot first? `build.effects` lists what the items
      carried do, `threat` describes what is nearby, and `self.hp_band` is current health.
    criteria:
      focus_boss:
        what: "Shoot the biggest enemy -- a boss or an elite -- first, and finish it."
        not_for: "When the small enemies are doing most of the damage, or kills are needed for healing."
      clear_adds:
        what: "Kill the small enemies first, leaving bosses and elites for last."
        not_for: "When a boss is nearly dead, or the small enemies are harmless."
      nearest:
        what: "Shoot whatever is closest, whatever it is."
        not_for: "When one enemy is clearly the real threat."

  continue_is_worthwhile:
    instructions: >-
      Progress on `control.active_action` is `control.progress_band`, with
      `control.consecutive_failures` recent failures. Is continuing still worth the time it
      is taking?
    criteria:
      "true": "The action remains valuable and is worth more attempts."
      "false": "The time cost now outweighs the reward."

  use_equipment_now:
    instructions: >-
      Should the character trigger `self.equipment.name` right now?
      `self.equipment.what_it_does` says what it does. Judge whether this moment justifies
      spending a limited-cooldown item of that kind.
    criteria:
      "true": "This moment justifies spending this particular equipment."
      "false": "Hold it. A clearly better moment is close, or the situation does not warrant it."

  situation_is_novel:
    instructions: >-
      Is the character in a situation that the available actions do not describe well?
    criteria:
      "true": "Something unusual is happening that the available actions do not cleanly address."
      "false": "An ordinary situation, well covered by the available actions."

  # One per registry record with requires_worth_gate: true. Per-verb instruction template;
  # `{entity_id}` is the target's stable entity ID.
  worth_gate:
    option_templates:
      use_shrine_chance:
        instructions: >-
          Is gambling at Shrine of Chance `{entity_id}` worth its gold cost right now, given
          `economy.gold_band` and how much this run needs items?
        criteria:
          "true": "The expected item is worth the gold and the risk of nothing."
          "false": "The gold is better spent on a guaranteed reward."
      use_shrine_blood:                            # AUTHORED-IN-PHASE-0
        instructions: >-
          Is paying health at Shrine of Blood `{entity_id}` worth it right now, given
          `self.hp_band`, `threat` and `economy.gold_band`?
        criteria:
          "true": "The gold is worth the health, and the health can be spared here."
          "false": "The health is worth more than the gold right now."
      start_teleporter:                            # AUTHORED-IN-PHASE-0
        instructions: >-
          Is starting the boss event at teleporter `{entity_id}` worth it right now, given
          `self.hp_band`, `build.identity`, `run.time_band`, `run.stage_time_band` and
          `objective.unopened_left_here` and `objective.affordable_left_here`? The stage ends
          only through the teleporter, and
          waiting has its own cost: `run.difficulty_band` rises with time, so the boss and
          every later stage get harder the longer this one lasts.
        criteria:
          "true": "The character is ready for the boss and the run gains from starting now."
          "false": "More preparation is worth the time it costs."
      advance_stage:                               # AUTHORED-IN-PHASE-0
        instructions: >-
          Is leaving the stage through teleporter `{entity_id}` worth it right now, given
          `run.time_band`, `economy.gold_band` and what is still reachable here?
        criteria:
          "true": "This stage has given what it is going to give."
          "false": "Something reachable here is still worth the time."
