# GENERATED from brain/registry.py by `python -m eval.gen_actions`. Do not edit by hand.
# The verb taxonomy lives in code so the registry builder and this file cannot drift.
schema_version: 1

commitment_gates:
  reversible: { entry: 0.4, worth_gate_required: false }
  costly: { entry: 0.5, worth_gate_required: false }
  irreversible: { entry: 0.55, worth_gate_required: true }

worth_threshold: 0.75

# Registry invariant 9. Ranking is in-range first, then nearest, then entity ID;
# everything the cap cuts is recorded so Phase 5 can ask what was never offered.
max_entity_actions: 12

