  status: verified                  # RESOLVED -- F8 was a version divergence, not a contradiction
  package: bbepis-BepInExPack
  version: "5.4.2122"
  major: 5
  notes: >
    Settled by what r2modman actually resolved: Rainflayer 1.1.1's Thunderstore manifest
    declares bbepis-BepInExPack-5.4.2121 and r2modman installed 5.4.2122. So the PUBLISHED
    mod is a BepInEx 5 mod.
    The csproj's BepInEx 6 assembly references (BepInEx.Core.dll, BepInEx.Unity.Mono.dll)
    have been present since the initial commit and describe the 2.0.0 source line, not the
    1.1.1 package. Consequence for the fork: forking 2.0.0 means BepInEx 6 and a SEPARATE
    r2modman profile, because this one is BepInEx 5.

r2api:
  status: installed_not_used        # REFINED -- see notes
  package: RiskofThunder-R2API_Core
  version: "5.3.0"
  notes: >
    Both things are true and they were conflated earlier. R2API is a DECLARED PACKAGE
    dependency in Rainflayer's Thunderstore manifest, so r2modman installs it and should be
    allowed to. It is NOT a code dependency: `git log --all -S R2API` over the whole
    upstream history returns nothing, and the csproj never references it. Leave it
    installed; it costs nothing and fighting the package manager gains nothing.

