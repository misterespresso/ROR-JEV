# Pinned build - Phase 0 step 3.
#
# Every version the agent depends on, and for the game the SHA-256 of the files that
# actually matter, because a Steam build id tells you which build Valve shipped and a hash
# tells you which one is on this disk. Rainflayer's Thunderstore page claims no game-version
# compatibility and Seekers of the Storm broke a large swathe of legacy mods, so "it worked
# last week" is not a version.
#
# Status of each block is explicit. `verified` means read off this machine. `unpinned` means
# not installed yet -- NOT "any version is fine".
#
# The mod must report these in HELLO_ACK (05-PROTOCOL.md section 3) and the recorder writes
# them into every recording (brain/recorder.py), so a recording found later is
# self-describing rather than trusted from memory.

